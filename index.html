<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiting Room Buddy</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/wrb-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/wrb-icon-192.png">
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WRB">
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f7f8;font-family:Arial,sans-serif;padding:18px}
main{max-width:680px;margin:auto;background:#17232d;border-radius:20px;padding:22px}
h1{font-size:34px;margin:0 0 6px}.sub{color:#c4d0d8;font-size:18px;margin:0 0 22px}h2{font-size:17px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.times{display:flex;gap:8px;flex-wrap:wrap}
button{background:#22333f;color:white;border:1px solid #526674;border-radius:12px;padding:15px;font-size:17px;cursor:pointer}
.times button{flex:1;min-width:90px}.active{background:#d9f4f1!important;color:#102028!important}
#panel{margin-top:20px;background:#0f1920;border-radius:14px;padding:20px;font-size:19px;line-height:1.5;min-height:120px}
#title{font-weight:bold;margin-bottom:8px}.primary{width:100%;margin-top:16px;background:#d9f4f1;color:#102028;font-weight:bold}.secondary{width:100%;margin-top:10px}
.chatTurn{margin:0 0 14px;white-space:pre-wrap}.chatRole{font-size:14px;font-weight:bold;color:#c4d0d8}.replyLabel{display:block;margin-top:16px;font-size:17px}#buddyReply{width:100%;margin-top:8px;padding:12px;border:1px solid #526674;border-radius:10px;background:#22333f;color:white;font:inherit;font-size:18px;min-height:90px}button:disabled{opacity:.6;cursor:wait}.small{color:#93a7b3;font-size:13px;margin-top:18px}.errorDetail{color:#f0c8c8;font-size:14px;margin-top:10px}.hidden{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head><body><main>
<h1>Waiting Room Buddy</h1><p class="sub">Got a few minutes? I'll keep you company.</p>
<button id="installWRB" class="primary hidden">Install Waiting Room Buddy</button>
<div id="installStatus" class="small hidden"></div>
<h2>1. How much time do we have?</h2>
<div class="times"><button onclick="setTime(this,'5 min')">5 min</button><button onclick="setTime(this,'10 min')">10 min</button><button onclick="setTime(this,'20+ min')">20+ min</button><button onclick="setTime(this,'No idea')">No idea</button></div>
<h2>2. Pick what sounds good</h2>
<div class="grid"><button onclick="interesting()">Show me something interesting</button><button onclick="today()">What's happening today?</button><button onclick="talk()">Let's talk</button><button onclick="useTime()">Help me use this time</button><button onclick="askBuddy(&quot;surprise&quot;)">Surprise me</button></div>
<div id="panel"><div id="title">Start here</div><div id="text">Choose a time, then choose what sounds good.</div><div id="controls"></div></div>
<button class="secondary" onclick="shareWRB()">Share Waiting Room Buddy</button><div class="small">Quiet by default. No microphone, camera, or location required.</div>
<footer class="small" style="text-align:center">© Anthony Ferlazzo, 2026</footer>
</main>
<script src="/buddy-variety.js"></script>
<script>
var chosenTime="No idea";
var buddyBusy=false;
var buddyConversation=[];
var buddyStorage;try{buddyStorage=localStorage}catch(_){buddyStorage={getItem:function(){return null},setItem:function(){}}}
var buddyMemory=WRBVariety.createMemory(buddyStorage);
function out(title,text,buttons){document.getElementById("title").textContent=title;document.getElementById("text").innerHTML=text;document.getElementById("controls").innerHTML=buttons||""}
function setTime(btn,t){chosenTime=t;var bs=document.querySelectorAll(".times button");for(var i=0;i<bs.length;i++)bs[i].className="";btn.className="active";out(t+" selected","Now pick what sounds good.","")}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function renderTalk(draft,error){
 var turns=buddyConversation.map(function(turn){return '<div class="chatTurn"><div class="chatRole">'+(turn.role==="user"?"You":"Buddy")+'</div>'+esc(turn.content)+'</div>'}).join("");
 var controls='<form id="buddyReplyForm" onsubmit="sendBuddyReply(event)"><label class="replyLabel" for="buddyReply">Your reply</label><textarea id="buddyReply" maxlength="1000" placeholder="What do you think?"'+(buddyBusy?' disabled':'')+'>'+esc(draft||"")+'</textarea><button class="primary" type="submit"'+(buddyBusy?' disabled':'')+'>'+(buddyBusy?'Buddy is replying…':'Send reply')+'</button></form><button class="secondary" onclick="resetBuddy()"'+(buddyBusy?' disabled':'')+'>Start over</button>';
 out("Let’s talk",turns+(error?'<div class="errorDetail" role="alert">'+esc(error)+'</div>':""),controls);
}
function sendBuddyReply(event){
 event.preventDefault();
 var reply=document.getElementById("buddyReply").value.trim();
 if(reply&&!buddyBusy)askBuddy("talk",reply);
}
async function askBuddy(mode,reply){
 if(buddyBusy)return;
 buddyBusy=true;
 var topicId=!reply&&["interesting","surprise","talk"].includes(mode)?buddyMemory.next():null;
 if(mode==="talk"&&reply)renderTalk(reply);else out("Thinking…","Finding something worthwhile for you.","");
 try{
  var r=await fetch("/api/buddy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:mode,time:chosenTime,topicId:topicId,recentStories:buddyMemory.recent(),reply:reply||"",conversation:mode==="talk"?buddyConversation:[]})});
  var raw=await r.text(),d={};
  try{d=JSON.parse(raw)}catch(_){d={error:"WRB received an unexpected server response ("+r.status+")."}}
  if(!r.ok){
   var message=d.error||("WRB request failed ("+r.status+").");
   if(r.status===429&&!/quota|credit|billing|balance|spend/i.test(message))message="Buddy is temporarily unavailable. Please wait a few minutes before trying again.";
   throw new Error(message);
  }
  if(typeof d.text!=="string"||!d.text.trim())throw new Error("Buddy returned an empty response. Please try again.");
  buddyMemory.remember(topicId,d.text);
  if(mode==="talk"){
   if(reply)buddyConversation.push({role:"user",content:reply});
   buddyConversation.push({role:"assistant",content:d.text});
   buddyConversation=buddyConversation.slice(-24);
   buddyBusy=false;renderTalk();return;
  }
  var label=mode==="use"?"Use this time":"Waiting Room Buddy";
  var again=mode==="talk"?"":'<button class="primary" onclick="askBuddy(&quot;'+mode+'&quot;)">Another one</button>';
  out(label,esc(d.text),again+'<button class="secondary" onclick="resetBuddy()">Start over</button>');
 }catch(e){
  if(mode==="talk"&&buddyConversation.length){buddyBusy=false;renderTalk(reply,e.message);return;}
  out("Couldn’t reach Buddy","The AI connection did not respond.<div class=\"errorDetail\">"+esc(e.message)+"</div>",'<button class="primary" onclick="askBuddy(&quot;'+mode+'&quot;)">Try again</button><button class="secondary" onclick="resetBuddy()">Start over</button>');
 }finally{buddyBusy=false;}
}
function interesting(){askBuddy("interesting")}
function today(){askBuddy("today")}
function talk(){if(buddyBusy)return;if(buddyConversation.length)renderTalk();else askBuddy("talk")}
function useTime(){askBuddy("use")}
async function shareWRB(){const data={title:"Waiting Room Buddy",text:"Try Waiting Room Buddy when you have a few minutes to wait.",url:location.origin};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==="AbortError")return}}try{await navigator.clipboard.writeText(location.origin);out("Share WRB","The WRB link has been copied. Paste it into a text, email, or message.","")}catch(e){out("Share WRB","Share this address: "+location.origin,"")}}
function resetBuddy(){if(buddyBusy)return;buddyConversation=[];chosenTime="No idea";var bs=document.querySelectorAll(".times button");for(var i=0;i<bs.length;i++)bs[i].className="";out("Start here","Choose a time, then choose what sounds good.","")}
</script><script src="/pwa.js"></script></body></html>
