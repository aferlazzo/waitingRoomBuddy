<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiting Room Buddy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f7f8;font-family:Arial,sans-serif;padding:18px}
main{max-width:680px;margin:auto;background:#17232d;border-radius:20px;padding:22px}
h1{font-size:34px;margin:0 0 6px}.sub{color:#c4d0d8;font-size:18px;margin:0 0 22px}h2{font-size:17px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.times{display:flex;gap:8px;flex-wrap:wrap}
button{background:#22333f;color:white;border:1px solid #526674;border-radius:12px;padding:15px;font-size:17px;cursor:pointer}
.times button{flex:1;min-width:90px}.active{background:#d9f4f1!important;color:#102028!important}
#panel{margin-top:20px;background:#0f1920;border-radius:14px;padding:20px;font-size:19px;line-height:1.5;min-height:120px}
#title{font-weight:bold;margin-bottom:8px}.primary{width:100%;margin-top:16px;background:#d9f4f1;color:#102028;font-weight:bold}.secondary{width:100%;margin-top:10px}
.small{color:#93a7b3;font-size:13px;margin-top:18px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Waiting Room Buddy</h1><p class="sub">Got a few minutes? I'll keep you company.</p>
<h2>1. How much time do we have?</h2>
<div class="times"><button onclick="setTime(this,'5 min')">5 min</button><button onclick="setTime(this,'10 min')">10 min</button><button onclick="setTime(this,'20+ min')">20+ min</button><button onclick="setTime(this,'No idea')">No idea</button></div>
<h2>2. Pick what sounds good</h2>
<div class="grid"><button onclick="interesting()">Show me something interesting</button><button onclick="today()">What's happening today?</button><button onclick="talk()">Let's talk</button><button onclick="useTime()">Help me use this time</button><button onclick="interesting()">Surprise me</button></div>
<div id="panel"><div id="title">Start here</div><div id="text">Choose a time, then choose what sounds good.</div><div id="controls"></div></div>
<div class="small">Quiet by default. No microphone, camera, or location required.</div>
</main>
<script>
var chosenTime="No idea", item=0;
var facts=[
["A tiny piece of history","The first text message was sent in 1992. It simply said “Merry Christmas.”"],
["Something hiding in plain sight","Your phone has motion sensors that can detect rotation, tilt and movement through space. Most of the time they are simply waiting for software to give them something interesting to do."],
["A scale worth thinking about","If Earth's 4.5-billion-year history were compressed into one calendar year, modern humans would arrive only in the final minutes of December 31."],
["An odd design fact","The QWERTY keyboard was designed for mechanical typewriters in the 1800s. Descendants of that layout are still used on glass phone screens."],
["Look around","Pick one ordinary object near you and imagine it had never been invented. What other things around you would have to be different?"]
];
function out(title,text,buttons){document.getElementById("title").textContent=title;document.getElementById("text").textContent=text;document.getElementById("controls").innerHTML=buttons||""}
function setTime(btn,t){chosenTime=t;var bs=document.querySelectorAll(".times button");for(var i=0;i<bs.length;i++)bs[i].className="";btn.className="active";out(t+" selected","Now pick what sounds good.","")}
function interesting(){var f=facts[item%facts.length];item++;out(f[0],f[1],'<button class="primary" onclick="interesting()">Another one</button><button class="secondary" onclick="resetBuddy()">Start over</button>')}
function today(){out("What's happening today?","This needs live information. I won't pretend canned material is today's news.",'<button class="secondary" onclick="resetBuddy()">Start over</button>')}
function talk(){out("Let's talk","What is something you've noticed lately that made you think, “there ought to be a better way”?",'<button class="secondary" onclick="resetBuddy()">Start over</button>')}
function useTime(){var m={"5 min":"Send one message you've been meaning to send, make one useful note, or clear five pieces of digital clutter.","10 min":"Pick one loose end you can advance from your phone and move it one real step toward finished.","20+ min":"Pick one small project and decide what 'better than when I sat down' would look like. Work only toward that.","No idea":"Start with something you can stop instantly: capture an idea, clear a few messages, or read something worthwhile."};out("Use this time · "+chosenTime,m[chosenTime],'<button class="secondary" onclick="resetBuddy()">Start over</button>')}
function resetBuddy(){chosenTime="No idea";var bs=document.querySelectorAll(".times button");for(var i=0;i<bs.length;i++)bs[i].className="";out("Start here","Choose a time, then choose what sounds good.","")}
</script></body></html>
