<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiting Room Buddy</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#101820;color:#f5f7f8;min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(720px,100%);background:#17232d;border:1px solid #31414d;border-radius:22px;padding:28px}
h1{font-size:clamp(30px,6vw,46px);margin:0 0 8px}.sub{color:#c4d0d8;font-size:18px;margin:0 0 24px}h2{font-size:17px;margin:22px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.time button{flex:1;min-width:100px}
button{border:1px solid #526674;background:#22333f;color:white;border-radius:12px;padding:14px 16px;font-size:16px;cursor:pointer}
button:hover,button:focus{background:#2b4352;outline:2px solid #9dd7dc;outline-offset:2px}.time button.active{background:#d9f4f1;color:#102028}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions button{text-align:left;min-height:62px;font-size:17px}
#panel{margin-top:22px;padding:20px;background:#0f1920;border-radius:14px;min-height:110px;line-height:1.5;font-size:18px}
#panel strong{display:block;margin-bottom:8px}.next{margin-top:14px;color:#b9cbd5}.small{color:#93a7b3;font-size:13px;margin-top:18px}
@media(max-width:520px){.actions{grid-template-columns:1fr}main{padding:20px}}
</style></head><body><main>
<h1>Waiting Room Buddy</h1><p class="sub">Got a few minutes? I'll keep you company.</p>
<h2>1. How much time do we have?</h2><div class="row time" id="times"><button>5 min</button><button>10 min</button><button>20+ min</button><button>No idea</button></div>
<h2>2. Pick what sounds good</h2><div class="actions">
<button data-kind="interesting">Show me something interesting</button><button data-kind="today">What's happening today?</button>
<button data-kind="talk">Let's talk</button><button data-kind="use">Help me use this time</button><button data-kind="surprise">Surprise me</button></div>
<div id="panel"><strong>Start here</strong>Choose a time, then choose one of the five options above. I'll take it from there.</div>
<p class="small">Quiet by default. No microphone, camera, or location required.</p>
</main><script>
let selected='';
const messages={
interesting:["Something interesting","Good choice. The finished Buddy will immediately bring you one worthwhile story, discovery, image, or idea.","Next: read it, ask about it, or tap another choice."],
today:["What's happening today?","The finished Buddy will give you a short, useful snapshot of what's worth knowing today—not an endless news feed.","Next: open one item that catches your attention or ask for something different."],
talk:["Let's talk","The Buddy will start the conversation so you don't have to think up a topic first.","Next: type naturally and we'll talk for as long as you have."],
use:["Use this time","The Buddy will offer a few useful things that actually fit your available time.","Next: pick one and the Buddy helps you do it."],
surprise:["Surprise me","The Buddy chooses something worth your attention. No quizzes and no brain teasers.","Next: enjoy it, follow the rabbit hole, or say 'another one.'"]
};
document.querySelectorAll('#times button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#times button').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.textContent;document.querySelector('#panel').innerHTML='<strong>Time selected: '+selected+'</strong>Now choose one of the five options above. I’ll take it from there.'});
document.querySelectorAll('.actions button').forEach(b=>b.onclick=()=>{const m=messages[b.dataset.kind];document.querySelector('#panel').innerHTML='<strong>'+m[0]+(selected?' · '+selected:'')+'</strong>'+m[1]+'<div class="next"><b>'+m[2].split(':')[0]+':</b>'+m[2].split(':').slice(1).join(':')+'</div>'});
</script></body></html>
