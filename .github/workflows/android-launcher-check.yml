name: Verify distributed WRB launcher and persistence
on:
  push:
    paths: ['.github/workflows/android-launcher-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify distributed package
        run: |
          mkdir -p launcher-evidence
          curl --fail --location --max-time 60 https://waitingroombuddy.netlify.app/downloads/WRB-v1.apk -o launcher-evidence/WRB-v1.apk
          cmp downloads/WRB-v1.apk launcher-evidence/WRB-v1.apk
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs launcher-evidence/WRB-v1.apk > launcher-evidence/signature.txt
          "$TOOLS/aapt" dump badging launcher-evidence/WRB-v1.apk > launcher-evidence/badging.txt
          grep "launchable-activity: name='com.google.androidbrowserhelper.trusted.LauncherActivity'" launcher-evidence/badging.txt
          grep "application-label:'Waiting Room Buddy'" launcher-evidence/badging.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, resolve launcher, close and reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install launcher-evidence/WRB-v1.apk
            adb shell pm list packages com.tonyferlazzo.wrb | tee launcher-evidence/installed.txt
            grep '^package:com.tonyferlazzo.wrb' launcher-evidence/installed.txt
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.tonyferlazzo.wrb | tee launcher-evidence/resolved-launcher.txt
            grep 'com.tonyferlazzo.wrb/com.google.androidbrowserhelper.trusted.LauncherActivity' launcher-evidence/resolved-launcher.txt
            adb logcat -b crash -c
            adb shell monkey -p com.tonyferlazzo.wrb -c android.intent.category.LAUNCHER 1 | tee launcher-evidence/first-launch.txt
            grep 'Events injected: 1' launcher-evidence/first-launch.txt
            adb shell am force-stop com.tonyferlazzo.wrb
            adb shell input keyevent KEYCODE_HOME
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.tonyferlazzo.wrb | tee launcher-evidence/after-close.txt
            grep 'com.tonyferlazzo.wrb/com.google.androidbrowserhelper.trusted.LauncherActivity' launcher-evidence/after-close.txt
            adb shell monkey -p com.tonyferlazzo.wrb -c android.intent.category.LAUNCHER 1 | tee launcher-evidence/reopen.txt
            grep 'Events injected: 1' launcher-evidence/reopen.txt
            adb shell am force-stop com.tonyferlazzo.wrb
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell input swipe 540 1700 540 300 500
            sleep 2
            adb shell uiautomator dump /sdcard/launcher.xml
            adb pull /sdcard/launcher.xml launcher-evidence/launcher.xml
            adb exec-out screencap -p > launcher-evidence/launcher.png
            adb logcat -b crash -d > launcher-evidence/crash.txt
            if grep -q 'FATAL EXCEPTION' launcher-evidence/crash.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WRB-launcher-evidence
          path: launcher-evidence/
